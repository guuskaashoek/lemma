name: Deploy to GuusLab Jet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # Native ARM64 runner: the Jet host is an Apple Silicon Mac mini.
    runs-on: ubuntu-24.04-arm
    # Actions are pinned to commit SHAs: this job can push the image Jet runs,
    # so a moved tag must not be able to change what it executes.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ghcr.io/guuskaashoek/jet-project-lemma:latest
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
